<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Decisions</title>
<meta name="description" content="Coffee and restaurants for a San Francisco walk, 31 Oct – 3 Nov 2026.">
<meta name="theme-color" content="#EEF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pour Decisions">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="wordmark">Pour Decisions</span>
      <span class="sub">San Francisco · 31 Oct – 3 Nov</span>
    </div>
    <div class="clock" id="clock" aria-live="off"></div>
  </header>

  <section class="mapwrap" id="mapwrap" aria-label="Map">
    <div id="map"></div>
    <div class="mapbtns">
      <button class="mapbtn" id="btn-expand" type="button" aria-label="Make the map bigger" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="mapbtn" id="btn-fit" type="button" aria-label="Show all places">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg>
      </button>
      <button class="mapbtn" id="btn-locate" type="button" aria-label="Show where I am">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 20l8-4 8 4z"/></svg>
      </button>
    </div>
    <div class="peek" id="peek" hidden></div>
  </section>

  <main class="panel" id="panel">
    <!-- Explore -->
    <section class="view" id="view-explore" data-view="explore">
      <div class="filters" id="filters">
        <div class="seg" role="radiogroup" aria-label="Kind of place">
          <button type="button" role="radio" data-kind="all" aria-checked="true">All</button>
          <button type="button" role="radio" data-kind="coffee" aria-checked="false"><i class="dot k-coffee"></i>Coffee</button>
          <button type="button" role="radio" data-kind="food" aria-checked="false"><i class="dot k-food"></i>Eat</button>
          <button type="button" role="radio" data-kind="drinks" aria-checked="false"><i class="dot k-drinks"></i>Drinks</button>
        </div>
        <div class="toggles">
          <button type="button" class="chip" id="f-open" aria-pressed="false">Open now</button>
          <button type="button" class="chip" id="f-unvisited" aria-pressed="false">Not been yet</button>
          <button type="button" class="chip" id="f-eater" aria-pressed="false">Eater 38</button>
          <button type="button" class="chip icon" id="f-search" aria-pressed="false" aria-label="Find a place by name">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
          </button>
        </div>
        <label class="search" id="searchrow" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
          <input id="f-q" type="search" placeholder="Name, area or dish" autocomplete="off" enterkeyhint="search" aria-label="Find a place by name, area or dish">
        </label>
      </div>
      <div class="locprompt" id="locprompt" hidden>
        <div>
          <strong>See what's closest</strong>
          <span>Turn on location and the list sorts by walking time from you. Until then, times are from your SoMa base.</span>
        </div>
        <button type="button" class="btn small" id="btn-locprompt">Use my location</button>
      </div>
      <p class="sortnote" id="sortnote"></p>
      <ol class="cards" id="list"></ol>
      <p class="empty" id="list-empty" hidden>Nothing matches. Try clearing a filter.</p>
    </section>

    <!-- Today -->
    <section class="view" id="view-today" data-view="today" hidden>
      <div class="days" id="days" role="tablist" aria-label="Trip day"></div>
      <div id="dayplan"></div>
    </section>

    <!-- Been there -->
    <section class="view" id="view-been" data-view="been" hidden>
      <div id="been"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="explore" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Nearby</span>
    </button>
    <button type="button" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Plan</span>
    </button>
    <button type="button" data-tab="been">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      <span>Been there <b class="count" id="been-count"></b></span>
    </button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grab" aria-hidden="true"></div>
    <button type="button" class="close" id="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-actions" id="sheet-actions"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
