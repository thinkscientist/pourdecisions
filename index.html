<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Decisions</title>
<meta name="description" content="Coffee and restaurants for a San Francisco walk, 31 Oct – 3 Nov 2026.">
<meta name="theme-color" content="#F2F4F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1820" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pour Decisions">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
  <section class="mapwrap" aria-label="Map">
    <div id="map"></div>
    <div class="mapbtns">
      <button class="mapbtn" id="btn-locate" type="button" aria-label="Show where I am">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 20l7-3.5 7 3.5z"/></svg>
      </button>
    </div>
    <div class="peek" id="peek" hidden></div>
  </section>

  <div class="drawer" id="drawer">
  <header class="brand" id="brand">
    <button type="button" class="handle" id="handle" aria-controls="panel" aria-expanded="true" aria-label="Hide the list"></button>
    <div class="lockup">
      <span class="wordmark">Pour Decisions</span>
      <span class="tagline">Coffee &amp; food · San Francisco</span>
    </div>
    <span class="clock" id="clock"></span>
  </header>

  <main class="panel" id="panel">
    <section class="view" data-view="explore">
      <div class="filters">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
          <input id="f-q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-label="Search by name, area or dish">
        </label>
        <div class="kinds" role="group" aria-label="Show only">
          <button type="button" class="chip k-coffee" data-kind="coffee" aria-pressed="false"><i class="dot"></i>Coffee</button>
          <button type="button" class="chip k-food" data-kind="food" aria-pressed="false"><i class="dot"></i>Eat</button>
          <button type="button" class="chip k-drinks" data-kind="drinks" aria-pressed="false"><i class="dot"></i>Drink</button>
        </div>
      </div>
      <p class="hint" id="lochint" hidden>Walking times from SoMa. <button type="button" class="link" id="btn-locprompt">Use my location</button></p>
      <ol class="list" id="list"></ol>
      <p class="empty" id="list-empty" hidden>No matches.</p>
      <p class="list-foot"><button type="button" class="link quiet" data-about>About this app</button></p>
    </section>

    <section class="view" data-view="plan" hidden>
      <div id="plan"></div>
    </section>
  </main>
  </div>
  </div>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="explore" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Nearby</span>
    </button>
    <button type="button" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
      <span>Plan <b class="count" id="plan-count"></b></span>
    </button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grab" aria-hidden="true"></div>
    <button type="button" class="close" id="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-actions" id="sheet-actions"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
